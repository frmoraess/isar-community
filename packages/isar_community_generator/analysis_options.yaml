include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    cascade_invocations: ignore
    avoid_positional_boolean_parameters: ignore
    parameter_assignments: ignore
    public_member_api_docs: ignore
    use_string_buffers: ignore
    # Path dependency on the sibling isar_community package is intentional so
    # git-dependency consumers resolve the in-repo copy; restored to a version
    # constraint at release time.
    invalid_dependency: ignore